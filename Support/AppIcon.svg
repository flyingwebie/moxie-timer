<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Original Moxie Timer artwork: a stopwatch with a progress ring. Not derived from any third-party logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4C93"/>
      <stop offset="1" stop-color="#1B2149"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CF0BE"/>
      <stop offset="1" stop-color="#22B07A"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <!-- crown and side button -->
  <rect x="462" y="208" width="100" height="46" rx="16" fill="#FFFFFF"/>
  <rect x="494" y="246" width="36" height="52" fill="#FFFFFF"/>
  <rect x="687" y="343" width="64" height="40" rx="14" fill="#FFFFFF" transform="rotate(45 719 363)"/>

  <!-- watch body -->
  <circle cx="512" cy="566" r="252" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-width="40"/>

  <!-- progress ring: three quarters of the way round -->
  <path d="M512 378 A188 188 0 1 1 324 566" fill="none" stroke="url(#ring)" stroke-width="58" stroke-linecap="round"/>

  <!-- hand -->
  <path d="M512 566 L512 452" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <path d="M512 566 L590 620" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round"/>
  <circle cx="512" cy="566" r="32" fill="#FFFFFF"/>
</svg>
