name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1) — creates tag v<version>"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        # Newest stable Xcode 26+ so Apple's on-device FoundationModels framework is available.
        run: |
          XCODE="$(ls -d /Applications/Xcode_2[6-9]*.app | grep -vi beta | sort -V | tail -1)"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      # A stable self-signed certificate keeps the app's code identity the same across releases, so macOS
      # remembers Keychain and Accessibility permissions after updates.
      - name: Import signing certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "No signing certificate configured; the app will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sign.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Moxie Timer Self-Signed" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          # codesign only uses trusted identities; trust this certificate for code signing on the runner.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          SHA1="$(security find-certificate -c "Moxie Timer Self-Signed" -Z "$KEYCHAIN" | awk '/SHA-1 hash:/ {print $3}')"
          security find-identity -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/sign.p12"
          echo "identity=$SHA1" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGN_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: ./scripts/build-app.sh --universal

      - name: Package
        id: package
        run: |
          ZIP="MoxieTimer-${{ steps.version.outputs.version }}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/MoxieTimer.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP="${{ steps.package.outputs.zip }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --target "${{ github.sha }}" \
              --title "Moxie Timer $TAG" \
              --generate-notes \
              --notes "$(cat <<'EOF'
          ## Install

          1. Download `MoxieTimer-*.zip`, unzip it and move **MoxieTimer.app** to /Applications.
          2. The app is ad-hoc signed (not notarized). On first launch, right-click it → **Open**, or run:
             `xattr -dr com.apple.quarantine /Applications/MoxieTimer.app`
          3. Open Settings in the widget and paste your Moxie API key and workspace base URL (Moxie → Custom API → Enable).

          Universal build: Apple Silicon + Intel, macOS 14 or later.

          > **Unofficial:** Moxie Timer is an independent project, not affiliated with, endorsed or supported by Moxie (withmoxie.com).
          > Provided "as is" without warranty; the authors accept no responsibility for its use.
          EOF
          )"
          fi
